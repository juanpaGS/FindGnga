<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FindGnga</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🎯 <b>FindGnga</b> <span class="tag">Black Friday · España</span></div>
    <nav class="tabs" id="tabs">
      <button data-view="desk">🪑 Mi escritorio</button>
      <button data-view="accessories">🧩 Accesorios</button>
      <button data-view="profile">🧑‍💻 Mi setup</button>
      <button data-view="monitors">🖥️ Monitores</button>
      <button data-view="ps5">🎮 PS5</button>
      <button data-view="shopcheck">🛡️ ¿Es fiable?</button>
      <button data-view="when">📈 Cuándo comprar</button>
      <button data-view="promos">🏷️ Cupones</button>
      <button data-view="settings">⚙️ Ajustes</button>
    </nav>
  </header>

  <main id="app"></main>

  <dialog id="offer-dialog">
    <form method="dialog" id="offer-form">
      <h3>Añadir / comprobar precio</h3>
      <p class="muted" id="offer-product"></p>
      <label>Tienda <select name="store" id="offer-store"></select></label>
      <label>URL del producto (para comprobar en vivo)
        <input name="url" type="url" placeholder="https://www.pccomponentes.com/..."></label>
      <div class="row">
        <label>Precio visto (€) <input name="price" type="number" step="0.01" min="0"></label>
        <label>Envío (€) <input name="shipping" type="number" step="0.01" min="0" placeholder="auto"></label>
      </div>
      <p class="muted small">“Comprobar en vivo” lee el precio de la página (funciona en la mayoría de tiendas; si alguna lo bloquea, escribe el precio a mano).</p>
      <p class="error" id="offer-error"></p>
      <div class="actions">
        <button value="cancel" class="ghost">Cancelar</button>
        <button type="button" id="offer-live" class="secondary">⚡ Comprobar en vivo</button>
        <button type="button" id="offer-save" class="primary">Guardar precio</button>
      </div>
    </form>
  </dialog>

  <script type="importmap">
    { "imports": { "three": "/static/vendor/three/three.module.min.js", "three/addons/": "/static/vendor/three/" } }
  </script>
  <script src="/static/app.js"></script>
  <script src="/static/desk-view.js"></script>
  <script type="module" src="/static/desk3d.js"></script>
</body>
</html>
